name: Build PerAppVolume

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash curl git make clang perl \
            python3 xz-utils unzip file

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL \
            https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          echo "[PASS] Theos is installed"

      - name: Check project files
        run: |
          test -f Makefile
          test -f PerAppVolume.mm
          test -f PVGainProcessor.c
          test -f PVGainProcessor.h
          echo "[PASS] All source files found"

      - name: Build dylib
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Verify output
        run: |
          set -eu

          echo "=== Generated files ==="
          find . -type f \
            \( -name "*.dylib" -o -name "*.deb" \) \
            -print

          DYLIB=$(find .theos -type f \
            -name "PerAppVolume.dylib" | head -n 1)

          if [ -z "$DYLIB" ]; then
            echo "::error::PerAppVolume.dylib not found"
            exit 1
          fi

          echo "=== Binary information ==="
          file "$DYLIB"

          if ! file "$DYLIB" | grep -q "Mach-O"; then
            echo "::error::Not an Apple Mach-O binary"
            exit 1
          fi

          echo "[PASS] Apple Mach-O detected"

          mkdir -p output
          cp "$DYLIB" output/
          cp packages/*.deb output/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PerAppVolume-build
          path: output/*
          if-no-files-found: error
